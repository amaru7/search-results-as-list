<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b8bff"/>
      <stop offset="1" stop-color="#8a5bff"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" rx="18" fill="url(#page)"/>

  <text x="700" y="70" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="700">Search Results as List</text>
  <text x="700" y="108" text-anchor="middle" fill="#9fb3d1" font-size="22">Global search results, always as a clean list — no extra click</text>

  <!-- BEFORE panel -->
  <g transform="translate(70,150)">
    <text x="0" y="-14" fill="#ff8a8a" font-size="20" font-weight="700">BEFORE — cluttered faceted view</text>
    <rect x="0" y="0" width="560" height="360" rx="14" fill="#141d38" stroke="#2a3a63" stroke-width="1.5"/>
    <g fill="#1d2a4d" stroke="#33477d" stroke-width="1">
      <rect x="24" y="26" width="248" height="96" rx="10"/>
      <rect x="288" y="26" width="248" height="96" rx="10"/>
      <rect x="24" y="140" width="248" height="96" rx="10"/>
      <rect x="288" y="140" width="248" height="96" rx="10"/>
      <rect x="24" y="254" width="512" height="82" rx="10"/>
    </g>
    <g fill="#6a80b3" font-size="13">
      <text x="40" y="52">From ▾</text><text x="304" y="52">Date ▾</text>
      <text x="40" y="166">Tags ▾</text><text x="304" y="166">Folder ▾</text>
      <text x="40" y="280">truncated snippet… truncated snippet…</text>
    </g>
    <g fill="#33477d">
      <circle cx="60" cy="82" r="14"/><circle cx="96" cy="82" r="14"/><circle cx="132" cy="82" r="14"/>
      <circle cx="324" cy="82" r="14"/><circle cx="360" cy="82" r="14"/>
    </g>
    <text x="280" y="352" text-anchor="middle" fill="#7184ad" font-size="13">few results fit • details truncated</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(700,330)">
    <circle r="34" fill="url(#accent)"/>
    <path d="M -12 0 L 10 0 M 1 -10 L 12 0 L 1 10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AFTER panel -->
  <g transform="translate(770,150)">
    <text x="0" y="-14" fill="#7ef0b0" font-size="20" font-weight="700">AFTER — sortable message list</text>
    <rect x="0" y="0" width="560" height="360" rx="14" fill="#141d38" stroke="#2a3a63" stroke-width="1.5"/>
    <rect x="16" y="16" width="528" height="30" rx="6" fill="#1d2a4d"/>
    <g fill="#9fb3d1" font-size="13" font-weight="700">
      <text x="30" y="36">Subject</text><text x="300" y="36">From</text><text x="440" y="36">Date</text>
    </g>
    <g font-size="13">
      <g transform="translate(0,54)">
        <rect x="16" y="0" width="528" height="30" fill="#17203c"/>
        <text x="30" y="20" fill="#e6eefc">Quarterly report — final draft</text>
        <text x="300" y="20" fill="#9fb3d1">Anna P.</text><text x="440" y="20" fill="#9fb3d1">Jul 2</text>
      </g>
      <g transform="translate(0,88)">
        <text x="30" y="20" fill="#e6eefc">Re: invoice #4821</text>
        <text x="300" y="20" fill="#9fb3d1">Billing</text><text x="440" y="20" fill="#9fb3d1">Jun 28</text>
      </g>
      <g transform="translate(0,120)">
        <rect x="16" y="0" width="528" height="30" fill="#17203c"/>
        <text x="30" y="20" fill="#e6eefc">Meeting notes and next steps</text>
        <text x="300" y="20" fill="#9fb3d1">M. Ochoa</text><text x="440" y="20" fill="#9fb3d1">Jun 27</text>
      </g>
      <g transform="translate(0,152)">
        <text x="30" y="20" fill="#e6eefc">Flight confirmation LX318</text>
        <text x="300" y="20" fill="#9fb3d1">Travel</text><text x="440" y="20" fill="#9fb3d1">Jun 25</text>
      </g>
      <g transform="translate(0,184)">
        <rect x="16" y="0" width="528" height="30" fill="#17203c"/>
        <text x="30" y="20" fill="#e6eefc">Photos from the trip</text>
        <text x="300" y="20" fill="#9fb3d1">Dad</text><text x="440" y="20" fill="#9fb3d1">Jun 22</text>
      </g>
      <g transform="translate(0,216)">
        <text x="30" y="20" fill="#e6eefc">Contract review needed</text>
        <text x="300" y="20" fill="#9fb3d1">Legal</text><text x="440" y="20" fill="#9fb3d1">Jun 20</text>
      </g>
      <g transform="translate(0,248)">
        <rect x="16" y="0" width="528" height="30" fill="#17203c"/>
        <text x="30" y="20" fill="#e6eefc">Newsletter — July edition</text>
        <text x="300" y="20" fill="#9fb3d1">News</text><text x="440" y="20" fill="#9fb3d1">Jun 19</text>
      </g>
    </g>
    <text x="280" y="352" text-anchor="middle" fill="#7ef0b0" font-size="13">more results per screen • full columns • click to sort</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b8dff"/>
      <stop offset="1" stop-color="#1f66e0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243356"/>
      <stop offset="1" stop-color="#131d33"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a3a7a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#e2e8f2" stroke-width="3"/>

  <!-- list bars -->
  <g filter="url(#soft)">
    <rect x="104" y="132" width="230" height="34" rx="17" fill="url(#bar)"/>
    <rect x="104" y="200" width="230" height="34" rx="17" fill="url(#bar)"/>
    <rect x="104" y="268" width="150" height="34" rx="17" fill="url(#bar)"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#soft)">
    <line x1="372" y1="372" x2="430" y2="430" stroke="url(#glass)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="322" cy="322" r="82" fill="#ffffff"/>
    <circle cx="322" cy="322" r="82" fill="none" stroke="url(#glass)" stroke-width="30"/>
  </g>
</svg>
